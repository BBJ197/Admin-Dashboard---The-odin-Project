<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Admin Dashbord</title>
</head>
<body>
    <div class="container">
        <div class="dashbord">
            <div class="logo">Dashbord</div>
            <div class="dashLinksTop">
                <a href="#" class="links">Home</a>
                <a href="#" class="links">Profile</a>
                <a href="#" class="links">Missage</a>
                <a href="#" class="links">History</a>
                <a href="#" class="links">Tasks</a>

                <a href="#" class="links">Support</a>
                <a href="#" class="links">Privacy</a>
            </div>
        </div>
        <div class="header">
            <form action="#" method="post">
                <button class="Search_button">Icon</button>
                <input type="search" id="site-search" name="q">
            </form>
            <div class="leftHeader">
                <div class="notification">icon</div>
                <div class="hLogo">logo</div>
                <div class="name">Beamlak Bekele</div>
            </div>
        </div>
        <div class="nav">
            <div class="nLogo"></div>
            <div class="greeting">
                <div>Hi there,</div>
                <div>Beamlak Bekele</div>
            </div>
            <div class="navbuttons">
                <button>New</button>
                <button>Upload</button>
                <button>Share</button>
            </div>
        </div>
        <div class="main">
            <div class="projects"></div>
            <div class="announcements"></div>
            <div class="trending"></div>
        </div>
    </div>
</body>
</html>
